name: Claude OAuth Auto-Refresh

on:
  schedule:
    - cron: '0 */23 * * *'   # every 23 hours
  workflow_dispatch:          # manual trigger anytime

env:
  CLIENT_ID: 9188040d-6c67-4c5b-b112-36a304b66dad
  TOKEN_URL: https://platform.claude.com/v1/oauth/token

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      # ── 1. Extract refresh token from stored credentials ──────────────────
      - name: Extract refresh token
        id: extract
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          CREDS=$(printf '%s' "$CLAUDE_CREDENTIALS_JSON" | base64 -d 2>/dev/null \
                  || printf '%s' "$CLAUDE_CREDENTIALS_JSON")
          RT=$(printf '%s' "$CREDS" | python3 -c \
               "import sys,json; print(json.load(sys.stdin)['claudeAiOauth']['refreshToken'])")
          if [ -z "$RT" ] || [ "$RT" = "None" ]; then
            echo "ERROR: no refresh token in CLAUDE_CREDENTIALS_JSON"
            exit 1
          fi
          echo "::add-mask::$RT"
          echo "refresh_token=$RT" >> "$GITHUB_OUTPUT"

      # ── 2. Call Anthropic token endpoint ──────────────────────────────────
      - name: Refresh OAuth token
        id: oauth
        env:
          REFRESH_TOKEN: ${{ steps.extract.outputs.refresh_token }}
        run: |
          RESP=$(curl -fsSL -X POST "$TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "anthropic-version: oauth-2025-04-20" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "client_id=$CLIENT_ID")

          ACCESS=$(printf '%s' "$RESP"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          NEW_RT=$(printf '%s' "$RESP"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token',''))")
          EXPIRES=$(printf '%s' "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in',2592000))")

          if [ -z "$ACCESS" ] || [ "$ACCESS" = "None" ]; then
            echo "OAuth refresh failed. Response: $RESP"
            exit 1
          fi

          echo "::add-mask::$ACCESS"
          [ -n "$NEW_RT" ] && echo "::add-mask::$NEW_RT"
          echo "access_token=$ACCESS"                      >> "$GITHUB_OUTPUT"
          echo "refresh_token=${NEW_RT:-$REFRESH_TOKEN}"  >> "$GITHUB_OUTPUT"
          echo "expires_in=$EXPIRES"                      >> "$GITHUB_OUTPUT"

      # ── 3. Build updated credentials JSON using jq (no heredocs needed) ───
      - name: Build new credentials JSON
        id: build
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
          NEW_ACCESS:  ${{ steps.oauth.outputs.access_token }}
          NEW_REFRESH: ${{ steps.oauth.outputs.refresh_token }}
          EXPIRES_IN:  ${{ steps.oauth.outputs.expires_in }}
        run: |
          CREDS=$(printf '%s' "$CLAUDE_CREDENTIALS_JSON" | base64 -d 2>/dev/null \
                  || printf '%s' "$CLAUDE_CREDENTIALS_JSON")
          EXPIRES_MS=$(( $(date +%s%3N) + EXPIRES_IN * 1000 ))
          NEW_CREDS=$(printf '%s' "$CREDS" | jq \
            --arg at "$NEW_ACCESS" \
            --arg rt "$NEW_REFRESH" \
            --argjson ea "$EXPIRES_MS" \
            '.claudeAiOauth.accessToken=$at | .claudeAiOauth.refreshToken=$rt | .claudeAiOauth.expiresAt=$ea')
          NEW_B64=$(printf '%s' "$NEW_CREDS" | base64 -w0)
          echo "::add-mask::$NEW_B64"
          echo "creds_b64=$NEW_B64" >> "$GITHUB_OUTPUT"

      # ── 4. Push refreshed credentials to the user Codespace secret ───────
      # GitHub user secrets have no "all repos" visibility, so we set the
      # value then separately grant every repo via the repositories API.
      - name: Update Codespace user secret + grant all repos
        env:
          GH_TOKEN:  ${{ secrets.GH_PAT_SECRETS }}
          CREDS_B64: ${{ steps.build.outputs.creds_b64 }}
        run: |
          # Set the user-level Codespace secret
          printf '%s' "$CREDS_B64" | base64 -d \
            | gh secret set CLAUDE_CREDENTIALS_JSON --user --app codespaces

          # Keep the repo Actions copy in sync so step 1 has fresh creds next run
          printf '%s' "$CREDS_B64" \
            | gh secret set CLAUDE_CREDENTIALS_JSON --repo sylt613/dotfiles

          # Grant to every repo (user secrets have no "all repos" toggle)
          REPO_IDS=$(gh api /user/repos --paginate --jq '[.[].id]' \
            | python3 -c "
import sys, json
ids = []
for line in sys.stdin:
    try: ids.extend(json.loads(line.strip()))
    except: pass
print(json.dumps({'selected_repository_ids': ids}))
")
          printf '%s' "$REPO_IDS" \
            | gh api -X PUT /user/codespaces/secrets/CLAUDE_CREDENTIALS_JSON/repositories \
                --input -
          echo "Granted CLAUDE_CREDENTIALS_JSON to all repos"

      # ── 5. Push fresh creds to the Fly.io machine ─────────────────────────
      - name: Deploy to Fly.io machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP:       vscode-cloud-sylt613
          CREDS_B64:     ${{ steps.build.outputs.creds_b64 }}
        run: |
          MACHINE_ID=$(curl -fsSL \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/$FLY_APP/machines" \
            | python3 -c "
import sys, json
ms = json.load(sys.stdin)
running = [m for m in ms if m.get('state') == 'started']
print(running[0]['id'] if running else '')
")
          if [ -z "$MACHINE_ID" ]; then
            echo "No running machine in $FLY_APP — skipping"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.machines.dev/v1/apps/$FLY_APP/machines/$MACHINE_ID/exec" \
            --data-binary "{\"cmd\":[\"/data/local/bin/claude-oauth-apply.sh\"],\"env\":{\"NEW_CREDS_B64\":\"$CREDS_B64\"},\"timeout\":30}"
