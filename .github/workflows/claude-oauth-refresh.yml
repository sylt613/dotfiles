name: Claude OAuth Auto-Refresh

on:
  schedule:
    - cron: '0 */23 * * *'   # every 23 hours
  workflow_dispatch:          # manual trigger anytime

env:
  FLY_APP: vscode-cloud-sylt613
  CLIENT_ID: 9188040d-6c67-4c5b-b112-36a304b66dad
  TOKEN_URL: https://platform.claude.com/v1/oauth/token

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      # ── 1. Extract current refresh token from stored credentials ──────────
      - name: Extract refresh token
        id: extract
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          CREDS=$(printf '%s' "$CLAUDE_CREDENTIALS_JSON" | base64 -d 2>/dev/null \
                  || printf '%s' "$CLAUDE_CREDENTIALS_JSON")
          RT=$(printf '%s' "$CREDS" | python3 -c \
               "import sys,json; print(json.load(sys.stdin)['claudeAiOauth']['refreshToken'])")
          if [ -z "$RT" ] || [ "$RT" = "None" ]; then
            echo "ERROR: no refresh token in CLAUDE_CREDENTIALS_JSON — run manual re-auth first"
            exit 1
          fi
          echo "::add-mask::$RT"
          echo "refresh_token=$RT" >> "$GITHUB_OUTPUT"

      # ── 2. Call token endpoint ────────────────────────────────────────────
      - name: Refresh OAuth token
        id: oauth
        env:
          REFRESH_TOKEN: ${{ steps.extract.outputs.refresh_token }}
        run: |
          RESP=$(curl -sS -X POST "$TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "anthropic-version: oauth-2025-04-20" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "client_id=$CLIENT_ID")

          ACCESS=$(printf '%s' "$RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          NEW_RT=$(printf '%s' "$RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token',''))")
          EXPIRES=$(printf '%s' "$RESP" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('expires_in', 2592000))")

          if [ -z "$ACCESS" ] || [ "$ACCESS" = "None" ] || [ "$ACCESS" = "" ]; then
            echo "OAuth refresh failed. Response: $RESP"
            exit 1
          fi

          echo "::add-mask::$ACCESS"
          [ -n "$NEW_RT" ] && echo "::add-mask::$NEW_RT"

          echo "access_token=$ACCESS" >> "$GITHUB_OUTPUT"
          # Prefer rotated refresh token; fall back to existing one
          echo "refresh_token=${NEW_RT:-$REFRESH_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "expires_in=$EXPIRES" >> "$GITHUB_OUTPUT"

      # ── 3. Build updated credentials JSON ────────────────────────────────
      - name: Build new credentials JSON
        id: build
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
          NEW_ACCESS: ${{ steps.oauth.outputs.access_token }}
          NEW_REFRESH: ${{ steps.oauth.outputs.refresh_token }}
          EXPIRES_IN: ${{ steps.oauth.outputs.expires_in }}
        run: |
          NEW_CREDS=$(python3 - <<'PYEOF'
import os, json, time, base64

raw_secret = os.environ["CLAUDE_CREDENTIALS_JSON"]
try:
    raw = base64.b64decode(raw_secret).decode()
except Exception:
    raw = raw_secret

d = json.loads(raw)
d["claudeAiOauth"]["accessToken"]  = os.environ["NEW_ACCESS"]
d["claudeAiOauth"]["refreshToken"] = os.environ["NEW_REFRESH"]
d["claudeAiOauth"]["expiresAt"]    = int((time.time() + int(os.environ["EXPIRES_IN"])) * 1000)
print(json.dumps(d))
PYEOF
)
          B64=$(printf '%s' "$NEW_CREDS" | base64 -w0)
          echo "::add-mask::$B64"
          echo "creds_b64=$B64" >> "$GITHUB_OUTPUT"

      # ── 4. Update CLAUDE_CREDENTIALS_JSON secret so next run has new RT ──
      - name: Update GitHub secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
          CREDS_B64: ${{ steps.build.outputs.creds_b64 }}
        run: |
          printf '%s' "$CREDS_B64" | \
            gh secret set CLAUDE_CREDENTIALS_JSON \
              --repo sylt613/dotfiles \
              --body "$(cat -)"

      # ── 5. Push new credentials to the Fly.io machine ────────────────────
      - name: Deploy to Fly.io machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CREDS_B64: ${{ steps.build.outputs.creds_b64 }}
        run: |
          # Get the running machine ID
          MACHINE_ID=$(curl -sS \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            "https://api.machines.dev/v1/apps/$FLY_APP/machines" | \
            python3 -c "
import sys, json
ms = json.load(sys.stdin)
running = [m for m in ms if m.get('state') == 'started']
print(running[0]['id'])
")

          if [ -z "$MACHINE_ID" ]; then
            echo "No running machine found in $FLY_APP"
            exit 1
          fi
          echo "Deploying to machine $MACHINE_ID"

          # Call exec endpoint — tokens passed as env var, never in cmd args
          RESULT=$(python3 - <<PYEOF
import os, json, urllib.request, urllib.error

payload = json.dumps({
    "cmd": ["/data/local/bin/claude-oauth-apply.sh"],
    "env": {"NEW_CREDS_B64": os.environ["CREDS_B64"]},
    "timeout": 30
}).encode()

req = urllib.request.Request(
    f"https://api.machines.dev/v1/apps/{os.environ['FLY_APP']}/machines/{os.environ['MACHINE_ID']}/exec",
    data=payload,
    headers={
        "Authorization": f"Bearer {os.environ['FLY_API_TOKEN']}",
        "Content-Type": "application/json",
    },
    method="POST",
)
try:
    with urllib.request.urlopen(req) as r:
        print(r.read().decode())
except urllib.error.HTTPError as e:
    print("HTTP error:", e.code, e.read().decode())
    raise
PYEOF
)
          echo "Machine exec result: $RESULT"
