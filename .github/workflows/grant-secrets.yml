name: grant-secrets
# Grants all Codespace secrets to every repo in the account.
# Run after creating a new repo — or it runs automatically every morning.
# Needs a classic PAT (repo + codespace scopes) in the GRANT_PAT or
# GH_PAT_SECRETS Actions secret; without one it no-ops cleanly (green run,
# no failure spam).
on:
  workflow_dispatch:   # manual: gh workflow run grant-secrets -R sylt613/dotfiles
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Save auth artifact (bootstrap for new codespaces)
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p /tmp/cs-auth
          [ -n "$CLAUDE_CREDENTIALS_JSON" ] && printf '%s' "$CLAUDE_CREDENTIALS_JSON" > /tmp/cs-auth/creds_b64.txt
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" > /tmp/cs-auth/oauth_token.txt
          ls -la /tmp/cs-auth/

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cs-auth
          path: /tmp/cs-auth/
          retention-days: 90
          overwrite: true

      - name: Restore missing user Codespace secrets from repo copies
        env:
          GH_TOKEN: ${{ secrets.GRANT_PAT != '' && secrets.GRANT_PAT || secrets.GH_PAT_SECRETS }}
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GH_TOKEN" ]; then exit 0; fi
          # If the user-level CLAUDE_CREDENTIALS_JSON was deleted, restore it from the
          # repo Actions copy (which oauth-refresh keeps in sync).
          if ! gh api /user/codespaces/secrets/CLAUDE_CREDENTIALS_JSON >/dev/null 2>&1; then
            if [ -n "$CLAUDE_CREDENTIALS_JSON" ]; then
              echo "CLAUDE_CREDENTIALS_JSON user secret missing — restoring from repo copy"
              printf '%s' "$CLAUDE_CREDENTIALS_JSON" | base64 -d \
                | gh secret set CLAUDE_CREDENTIALS_JSON --user --app codespaces \
                && echo "✅ Restored CLAUDE_CREDENTIALS_JSON" \
                || echo "⚠️ Restore failed"
            else
              echo "⚠️ CLAUDE_CREDENTIALS_JSON missing from both user secrets and repo copy"
            fi
          else
            echo "✅ CLAUDE_CREDENTIALS_JSON user secret present"
          fi

      - name: Grant all Codespace secrets to all repos
        env:
          GH_TOKEN: ${{ secrets.GRANT_PAT != '' && secrets.GRANT_PAT || secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No GRANT_PAT / GH_PAT_SECRETS Actions secret set — nothing to do. Add a classic PAT (repo + codespace scopes) to enable automatic granting."
            exit 0
          fi
          bash setup-secrets.sh --grant
