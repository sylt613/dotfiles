name: grant-secrets
# Grants all Codespace secrets to every repo in the account.
# Run after creating a new repo — or it runs automatically every morning.
# Needs a classic PAT (repo + codespace scopes) in the GRANT_PAT or
# GH_PAT_SECRETS Actions secret; without one it no-ops cleanly (green run,
# no failure spam).
on:
  workflow_dispatch:   # manual: gh workflow run grant-secrets -R sylt613/dotfiles
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Grant all Codespace secrets to all repos
        env:
          GH_TOKEN: ${{ secrets.GRANT_PAT != '' && secrets.GRANT_PAT || secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No GRANT_PAT / GH_PAT_SECRETS Actions secret set — nothing to do. Add a classic PAT (repo + codespace scopes) to enable automatic granting."
            exit 0
          fi
          bash setup-secrets.sh --grant
