name: grant-secrets
# Grants all Codespace secrets to every repo in the account.
# Run this after creating a new repo — or it runs automatically every morning.
on:
  workflow_dispatch:   # manual: gh workflow run grant-secrets -R sylt613/dotfiles
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Grant all Codespace secrets to all repos
        env:
          GH_TOKEN: ${{ secrets.GRANT_PAT }}
        run: |
          bash setup-secrets.sh --grant
